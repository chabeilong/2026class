# 班级通讯录 —— nginx 反向代理配置（来源：/etc/nginx/sites-available/addressbook）
#
# 这个文件是「唯一可信副本」，restore.sh 会把它复制回系统：
#   cp deploy/nginx-addressbook.conf /etc/nginx/sites-available/addressbook
#   ln -sf /etc/nginx/sites-available/addressbook /etc/nginx/sites-enabled/addressbook
#   rm -f /etc/nginx/sites-enabled/default
# 下次要改 nginx 行为（如端口、超时），改这里再跑 restore.sh，别只改 /etc。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
